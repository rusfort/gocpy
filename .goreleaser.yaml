# GoReleaser: `git tag v0.1.0 && git push --tags` -> GitHub Actions builds the release.
version: 2
project_name: gocpy

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: gocpy
    main: ./cmd/gocpy
    binary: gocpy
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]

archives:
  - formats: [tar.gz]
    name_template: "gocpy_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE, examples/**/*]

checksum:
  name_template: checksums.txt

# Homebrew tap: repository rusfort/homebrew-tap, token in secret HOMEBREW_TAP_TOKEN.
# Since GoReleaser v2.10 pre-built binaries are published as a Cask (brews is deprecated).
homebrew_casks:
  - name: gocpy
    binaries: [gocpy]
    repository:
      owner: rusfort
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    homepage: https://github.com/rusfort/gocpy
    description: Gocpy compiler (Go-like language compiled to native code via C)
    license: MIT
    dependencies:
      - formula: bdw-gc
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/gocpy"]
          end

# Linux packages: .deb (Debian/Ubuntu), .rpm (Fedora/RHEL), .apk (Alpine)
nfpms:
  - id: packages
    package_name: gocpy
    vendor: Gocpy
    homepage: https://github.com/rusfort/gocpy
    maintainer: rusfort <info@box-messenger.tech>
    description: Gocpy compiler (Go-like language compiled to native code via C)
    license: MIT
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    overrides:
      deb:
        dependencies: [gcc, libgc-dev]
      rpm:
        dependencies: [gcc, gc-devel]
      apk:
        dependencies: [gcc, musl-dev, gc-dev]

release:
  github:
    owner: rusfort
    name: gocpy
